<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERD Viewer Architecture — OpenMetadata API Path</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper:#f5f5f5; --paper-2:#ececec; --ink:#2d3142; --muted:#4f5d75; --soft:#5a6580; --rule:#bfc0c0; --accent:#bf4520; --accent-tint:rgba(191,69,32,.08); --link:#2e5aa8; --sans:'Geist',system-ui,sans-serif; --serif:'Instrument Serif',serif; --mono:'Geist Mono',ui-monospace,monospace; }
    body { min-height:100vh; padding:48px 32px; background:var(--paper); color:var(--ink); font-family:var(--sans); display:flex; justify-content:center; align-items:center; }
    .frame { width:100%; max-width:1360px; min-width:0; }
    .eyebrow { margin-bottom:8px; color:var(--muted); font:500 11px/1 var(--mono); letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin-bottom:24px; font:400 40px/1.1 var(--serif); letter-spacing:-.02em; }
    .diagram-container { width:100%; overflow-x:auto; border:1px solid rgba(45,49,66,.12); }
    svg { width:100%; min-width:1280px; display:block; }
    .zone { fill:var(--paper-2); stroke:rgba(45,49,66,.12); }
    .zone-label, .tag, .sub, .edge-label, .legend { font-family:var(--mono); }
    .zone-label { fill:var(--soft); font-size:8px; font-weight:600; letter-spacing:.14em; }
    .node { fill:var(--paper); stroke:var(--muted); stroke-width:1.5; }
    .node-accent { fill:var(--accent-tint); stroke:var(--accent); stroke-width:2; }
    .tag-bg { fill:var(--paper-2); stroke:var(--rule); }
    .tag-bg-accent { fill:var(--accent); stroke:var(--accent); }
    .tag { fill:var(--muted); font-size:8px; font-weight:600; letter-spacing:.08em; }
    .tag-light { fill:#fff; }
    .name { fill:var(--ink); font:600 16px/1 var(--sans); }
    .sub { fill:var(--soft); font-size:11px; }
    .api-line { fill:var(--ink); font:500 11px/1 var(--mono); }
    .api-note { fill:var(--accent); font:600 8px/1 var(--mono); letter-spacing:.1em; }
    .arrow { fill:none; stroke:var(--muted); stroke-width:1.5; marker-end:url(#arrow); }
    .arrow-link { fill:none; stroke:var(--link); stroke-width:2; marker-end:url(#arrow-link); }
    .arrow-dashed { fill:none; stroke:var(--muted); stroke-width:1.5; stroke-dasharray:5 4; marker-end:url(#arrow); }
    .edge-mask { fill:var(--paper-2); }
    .edge-label { fill:var(--link); font-size:8px; font-weight:600; letter-spacing:.05em; }
    .legend { fill:var(--muted); font-size:9px; }
    @media print { .diagram-container { overflow-x:visible; } svg { min-width:0; } }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Architecture · Read-only metadata flow</p>
    <h1>ERD Viewer architecture — the OpenMetadata API path</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="erd-viewer-architecture-title erd-viewer-architecture-desc">
        <title id="erd-viewer-architecture-title">ERD Viewer architecture and OpenMetadata API path</title>
        <desc id="erd-viewer-architecture-desc">The React ERD viewer calls four fixed read-only FastAPI routes, which use a server-side OpenMetadata SDK and JWT to retrieve catalog entities from OpenMetadata APIs.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
          <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="rgba(45,49,66,.10)"/></pattern>
        </defs>
        <rect width="1280" height="720" fill="#f5f5f5"/>
        <rect width="1280" height="660" fill="url(#dots)" opacity=".45"/>

        <rect class="zone" x="40" y="48" width="444" height="528" rx="8"/>
        <text class="zone-label" x="60" y="72">BROWSER · NO OMD CREDENTIALS</text>
        <rect class="zone" x="508" y="48" width="420" height="528" rx="8"/>
        <text class="zone-label" x="528" y="72">LOCAL FASTAPI ADAPTER · READ ONLY</text>
        <rect class="zone" x="952" y="48" width="288" height="528" rx="8"/>
        <text class="zone-label" x="972" y="72">OPENMETADATA 2.0.5</text>

        <!-- Connectors are intentionally drawn before nodes. -->
        <path class="arrow" d="M252 220 H292"/>
        <path class="arrow-link" d="M464 220 H540"/>
        <rect class="edge-mask" x="480" y="202" width="48" height="12"/>
        <text class="edge-label" x="504" y="211" text-anchor="middle">HTTP GET</text>
        <path class="arrow" d="M724 296 V336"/>
        <path class="arrow" d="M808 412 H852"/>
        <path class="arrow-link" d="M924 412 H988"/>
        <rect class="edge-mask" x="936" y="394" width="44" height="12"/>
        <text class="edge-label" x="958" y="403" text-anchor="middle">REST</text>
        <path class="arrow" d="M612 464 V504"/>
        <path class="arrow-dashed" d="M780 464 V504"/>

        <rect class="node" x="76" y="156" width="176" height="128" rx="6"/>
        <rect class="tag-bg" x="92" y="172" width="52" height="18" rx="2"/>
        <text class="tag" x="118" y="184" text-anchor="middle">REACT</text>
        <text class="name" x="92" y="218">ERD Viewer UI</text>
        <text class="sub" x="92" y="242">React Flow · ELK.js</text>
        <text class="sub" x="92" y="262">ephemeral view state</text>

        <rect class="node" x="292" y="156" width="172" height="128" rx="6"/>
        <rect class="tag-bg" x="308" y="172" width="72" height="18" rx="2"/>
        <text class="tag" x="344" y="184" text-anchor="middle">API CLIENT</text>
        <text class="name" x="308" y="218">Catalog client</text>
        <text class="sub" x="308" y="242">fetch + AbortSignal</text>
        <text class="sub" x="308" y="262">same-origin /api</text>

        <rect class="node-accent" x="540" y="108" width="368" height="188" rx="6"/>
        <rect class="tag-bg-accent" x="556" y="124" width="128" height="18" rx="2"/>
        <text class="tag tag-light" x="620" y="136" text-anchor="middle">FIXED API SURFACE</text>
        <text class="name" x="556" y="168">ERD adapter APIs</text>
        <text class="api-note" x="892" y="168" text-anchor="end">GET ONLY</text>
        <text class="api-line" x="556" y="196">GET /api/services</text>
        <text class="api-line" x="556" y="220">GET /api/databases?serviceId=…</text>
        <text class="api-line" x="556" y="244">GET /api/schemas?databaseId=…</text>
        <text class="api-line" x="556" y="268">GET /api/schemas/{schemaId}/graph</text>

        <rect class="node" x="548" y="336" width="260" height="128" rx="6"/>
        <rect class="tag-bg" x="564" y="352" width="92" height="18" rx="2"/>
        <text class="tag" x="610" y="364" text-anchor="middle">TRANSFORM</text>
        <text class="name" x="564" y="398">Catalog service</text>
        <text class="sub" x="564" y="422">pagination · PK/FK mapping</text>
        <text class="sub" x="564" y="442">owners · tags · tiers · views</text>

        <rect class="node" x="852" y="348" width="72" height="116" rx="6"/>
        <rect class="tag-bg" x="864" y="364" width="48" height="18" rx="2"/>
        <text class="tag" x="888" y="376" text-anchor="middle">SDK</text>
        <text class="name" x="888" y="410" text-anchor="middle">OMD</text>
        <text class="sub" x="888" y="434" text-anchor="middle">2.0.5.1</text>

        <rect class="node-accent" x="988" y="156" width="216" height="308" rx="6"/>
        <rect class="tag-bg-accent" x="1004" y="172" width="84" height="18" rx="2"/>
        <text class="tag tag-light" x="1046" y="184" text-anchor="middle">OMD APIS</text>
        <text class="name" x="1004" y="218">OpenMetadata REST API</text>
        <text class="api-note" x="1188" y="242" text-anchor="end">JWT · SERVER SIDE</text>
        <text class="api-line" x="1004" y="278">get_by_id</text>
        <text class="sub" x="1004" y="298">DatabaseService</text>
        <text class="sub" x="1004" y="318">Database · DatabaseSchema</text>
        <text class="api-line" x="1004" y="354">list_entities</text>
        <text class="sub" x="1004" y="374">DatabaseService · Database</text>
        <text class="sub" x="1004" y="394">DatabaseSchema · Table</text>
        <text class="sub" x="1004" y="430">fields: columns, constraints,</text>
        <text class="sub" x="1004" y="448">owners, tags, tableType</text>

        <rect class="node" x="548" y="504" width="128" height="56" rx="6"/>
        <text class="name" x="564" y="530">TTL cache</text>
        <text class="sub" x="564" y="550">in process</text>
        <rect class="node" x="716" y="504" width="160" height="56" rx="6"/>
        <text class="name" x="732" y="530">Sample graph</text>
        <text class="sub" x="732" y="550">offline fallback</text>

        <line x1="40" y1="636" x2="1240" y2="636" stroke="#bfc0c0"/>
        <line x1="64" y1="672" x2="100" y2="672" stroke="#2e5aa8" stroke-width="2" marker-end="url(#arrow-link)"/>
        <text class="legend" x="112" y="676">HTTP / OpenMetadata API call</text>
        <rect x="360" y="660" width="32" height="24" rx="4" fill="rgba(191,69,32,.08)" stroke="#bf4520" stroke-width="2"/>
        <text class="legend" x="404" y="676">emphasized API boundary</text>
        <line x1="664" y1="672" x2="700" y2="672" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
        <text class="legend" x="712" y="676">failure-only fallback</text>
        <text class="legend" x="1216" y="676" text-anchor="end">No write path · no JWT in browser</text>
      </svg>
    </div>
  </main>
</body>
</html>
