<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Marketplace</title>
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/fa/css/font-awesome.min.css">
  <link rel="stylesheet" href="/css/wsbc.css">
</head>
<body>
  <div id="app-header"></div>

  <section class="wsbc-search">
    <div class="container">
      <h1 class="mb-3">Find data products</h1>
      <label class="visually-hidden" for="nl-search">Natural language search</label>
      <div class="input-group mb-2">
        <span class="input-group-text"><i class="fa fa-magic" aria-hidden="true"></i></span>
        <input id="nl-search" class="form-control form-control-lg" type="text" disabled
               placeholder='Ask in plain English, e.g. "claims data with no personal information" (coming soon)'>
      </div>
      <label class="visually-hidden" for="keyword-search">Search by keyword</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fa fa-search" aria-hidden="true"></i></span>
        <input id="keyword-search" class="form-control" type="search" placeholder="Search by name, description, glossary term or tag">
      </div>
    </div>
  </section>

  <main class="container py-4">
    <div class="row">
      <aside class="col-md-3 wsbc-filters" id="filters" aria-label="Filters"></aside>
      <section class="col-md-9">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <span id="result-count" class="wsbc-meta" aria-live="polite"></span>
          <button id="clear-filters" class="btn btn-sm btn-wsbc-outline" type="button" hidden>Clear filters</button>
        </div>
        <div id="results"></div>
      </section>
    </div>
  </main>

  <script type="module" src="/js/search.js"></script>
</body>
</html>
